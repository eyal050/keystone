name: reelhouse-build-deploy

# Builds the ReelHouse API container image, pushes to ACR, updates the
# Container App to the new image, and verifies it serves traffic.
#
# Triggers:
#   - Push to main that touches app/api/** (CI on real changes only)
#   - Manual dispatch (when you want to force a rebuild)
#
# Auth: federated OIDC to the workload's UAMI per ADR-0015.
# No long-lived secrets — `azure/login@v2` exchanges the workflow's
# OIDC token for an Azure access token at runtime.

on:
  push:
    branches: [main]
    paths:
      - "app/api/**"
      - ".github/workflows/reelhouse-build-deploy.yml"
  workflow_dispatch:

# OIDC requires id-token: write; checkout requires contents: read.
permissions:
  id-token: write
  contents: read

# Non-sensitive infra coordinates. These map to terraform outputs of
# workloads/reelhouse/dev. If a layer change moves any of them, update
# here in lockstep (cross-layer-vend lesson, applied to CI).
env:
  ACR_NAME: acrreelhdevbkwcrzrg
  WORKLOAD_RG: rg-reelhouse-dev-workload-weu-001
  CONTAINER_APP_NAME: ca-reelhouse-api-weu-001
  CONTAINER_APP_FQDN: ca-reelhouse-api-weu-001.thankfulsky-dcda6bbd.westeurope.azurecontainerapps.io
  IMAGE_REPO: reelhouse-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Auth + verification ----------------------------------------------

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure auth context
        run: |
          set -euo pipefail
          subname=$(az account show --query name -o tsv)
          subid=$(az account show --query id -o tsv)
          echo "Authenticated to: $subname"
          # The workflow must run against lab-foundation (the workload sub).
          # If a misconfigured client-id points us at the wrong sub, fail fast.
          if [[ "$subname" != "lab-foundation" ]]; then
            echo "ERROR: expected to land in 'lab-foundation' sub, got '$subname'" >&2
            exit 1
          fi
          if [[ "$subid" != "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]]; then
            echo "ERROR: sub id mismatch (token sub != configured sub)" >&2
            exit 1
          fi

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          echo "Logged in to $ACR_NAME"

      # --- Build + push -----------------------------------------------------

      - name: Build image
        run: |
          set -euo pipefail
          full_latest="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:latest"
          full_sha="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${GITHUB_SHA}"
          echo "Building $full_sha (also tagged :latest)"
          docker build \
            -t "$full_latest" \
            -t "$full_sha" \
            app/api/
          # Verify both tags exist locally before pushing.
          if ! docker image inspect "$full_latest" >/dev/null; then
            echo "ERROR: local build did not produce $full_latest" >&2
            exit 1
          fi
          if ! docker image inspect "$full_sha" >/dev/null; then
            echo "ERROR: local build did not produce $full_sha" >&2
            exit 1
          fi

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_REPO}:latest"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${GITHUB_SHA}"

      - name: Verify image landed in ACR
        run: |
          set -euo pipefail
          # Confirm both tags are visible from the registry API (not just
          # docker's local view).
          tags=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_REPO" \
            --orderby time_desc \
            -o tsv)
          echo "Tags in ACR: $tags"
          if ! echo "$tags" | grep -q "^latest$"; then
            echo "ERROR: :latest tag missing from $ACR_NAME/$IMAGE_REPO" >&2
            exit 1
          fi
          if ! echo "$tags" | grep -q "^${GITHUB_SHA}$"; then
            echo "ERROR: :${GITHUB_SHA} tag missing from $ACR_NAME/$IMAGE_REPO" >&2
            exit 1
          fi

      # --- Wire up registry on Container App (idempotent) ------------------

      - name: Ensure ACA registry config
        run: |
          set -euo pipefail
          # Idempotent: if the registry binding already exists, this
          # updates it; if not, it creates it. Identity "system" =
          # the Container App's system-assigned MI (granted AcrPull
          # on this ACR in terraform acr.tf).
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$WORKLOAD_RG" \
            --server "${ACR_NAME}.azurecr.io" \
            --identity system >/dev/null

      # --- Deploy new revision ---------------------------------------------

      - name: Update Container App to new image
        run: |
          set -euo pipefail
          target_image="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${GITHUB_SHA}"
          echo "Updating $CONTAINER_APP_NAME to $target_image"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$WORKLOAD_RG" \
            --image "$target_image" >/dev/null
          # Confirm the active config reflects the new image.
          current=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$WORKLOAD_RG" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "ACA reports active image: $current"
          if [[ "$current" != "$target_image" ]]; then
            echo "ERROR: image update did not stick" >&2
            exit 1
          fi

      - name: Wait for new revision to be healthy
        run: |
          set -euo pipefail
          # Poll the latest revision until it reaches a terminal state.
          # `provisioningState` should become `Provisioned`; `runningState`
          # should become `Running`. Give it 5 minutes max.
          deadline=$(( $(date +%s) + 300 ))
          while true; do
            rev=$(az containerapp revision list \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$WORKLOAD_RG" \
              --query "sort_by([], &properties.createdTime)[-1]" -o json)
            prov_state=$(echo "$rev" | jq -r '.properties.provisioningState')
            run_state=$(echo "$rev" | jq -r '.properties.runningState')
            rev_name=$(echo "$rev" | jq -r '.name')
            echo "Revision $rev_name: provisioning=$prov_state, running=$run_state"
            if [[ "$prov_state" == "Provisioned" && "$run_state" == "Running" ]]; then
              echo "New revision is healthy."
              break
            fi
            if [[ "$prov_state" == "Failed" ]]; then
              echo "ERROR: revision provisioning failed" >&2
              echo "$rev" | jq '.properties'
              exit 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "ERROR: timed out waiting for revision to be healthy" >&2
              echo "$rev" | jq '.properties'
              exit 1
            fi
            sleep 10
          done

      # --- End-to-end HTTP verification ------------------------------------

      - name: Verify /healthz returns 200 ok
        run: |
          set -euo pipefail
          # Give ACA a few seconds to reroute traffic to the new revision.
          sleep 5
          url="https://${CONTAINER_APP_FQDN}/healthz"
          # Retry a few times — initial cold-start can be slow.
          for attempt in 1 2 3 4 5; do
            echo "GET $url (attempt $attempt)"
            code=$(curl -sS -o /tmp/healthz.out -w "%{http_code}" \
              --max-time 30 "$url" || true)
            body=$(cat /tmp/healthz.out)
            echo "  → HTTP $code, body: $body"
            if [[ "$code" == "200" && "$body" == "ok" ]]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: /healthz did not return 200 ok after 5 attempts" >&2
          exit 1

      - name: Verify root page contains 'ReelHouse'
        run: |
          set -euo pipefail
          url="https://${CONTAINER_APP_FQDN}/"
          echo "GET $url"
          code=$(curl -sS -o /tmp/root.html -w "%{http_code}" \
            --max-time 30 "$url")
          if [[ "$code" != "200" ]]; then
            echo "ERROR: root returned HTTP $code (expected 200)" >&2
            head -50 /tmp/root.html >&2 || true
            exit 1
          fi
          if ! grep -qi 'ReelHouse' /tmp/root.html; then
            echo "ERROR: root HTML doesn't contain 'ReelHouse'" >&2
            head -50 /tmp/root.html >&2
            exit 1
          fi
          echo "Root page check passed."

      - name: Summary
        if: success()
        run: |
          echo "==================================="
          echo "Deploy succeeded."
          echo "Image:     ${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${GITHUB_SHA}"
          echo "App URL:   https://${CONTAINER_APP_FQDN}/"
          echo "==================================="
