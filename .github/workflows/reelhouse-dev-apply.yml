name: reelhouse-dev-apply

# Terraform apply for workloads/reelhouse/dev.
#
# GATE: the job runs in the `workload-dev` GitHub Environment, which carries a
# required-reviewer protection rule (added once the repo went public, 2026-05-29
# — ADR-0018). GitHub only mints the tfapply UAMI's environment-scoped OIDC
# token (...:environment:workload-dev) AFTER that approval, so apply is
# cryptographically gated on a human, not just procedurally. workflow_dispatch
# is kept for manual re-runs.

on:
  push:
    branches: [main]
    paths:
      - "workloads/reelhouse/dev/**"
      - ".github/workflows/reelhouse-dev-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  LAYER_DIR: workloads/reelhouse/dev
  STATE_RG: rg-tfstate-plat-weu-001
  STATE_CONTAINER: tfstate
  STATE_KEY: workloads-reelhouse-dev.tfstate
  STATE_SA: sttfstateplatweu66ff6e
  # Terraform authenticates via OIDC directly (see plan workflow). Uses the
  # environment-scoped apply identity.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_TF_APPLY_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_workload_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_connectivity_subscription_id: ${{ secrets.AZURE_CONNECTIVITY_SUBSCRIPTION_ID }}
  TF_VAR_mgmt_subscription_id: ${{ secrets.AZURE_MGMT_SUBSCRIPTION_ID }}
  TF_VAR_operator_ip: ${{ secrets.OPERATOR_IP }}
  TF_VAR_state_storage_account_name: sttfstateplatweu66ff6e

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workload-dev   # env-scoped OIDC subject + secret
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure OIDC login (tfapply, read-write)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TF_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: |
          terraform -chdir="$LAYER_DIR" init \
            -backend-config="subscription_id=${{ secrets.AZURE_MGMT_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="use_azuread_auth=true"

      - name: terraform apply
        run: |
          terraform -chdir="$LAYER_DIR" apply -input=false -auto-approve -no-color
